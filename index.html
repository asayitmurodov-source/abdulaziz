<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdulaziz Sayitmurodov Nosirovich</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23161616'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='%23f2f2f2' font-family='sans-serif' font-weight='700'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js');</script>
<style>
  :root{
    --bg:#0e0e0e;
    --surface:#161616;
    --line:#2b2b2b;
    --mute:#8d8d8d;
    --text:#f2f2f2;
    --pad:clamp(1.25rem, 5vw, 4rem);
    --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
    --ui:'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --ease:cubic-bezier(.65,0,.2,1);
    --settle:cubic-bezier(.2,.8,.2,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  :focus-visible{outline:2px solid var(--text);outline-offset:3px}

  /* Used when the language changes: jump back to the start, then fall again */
  .reset *,.reset *::before{transition:none !important}

  /* ---------- Language switcher (top) ---------- */
  .lang{
    position:fixed;
    top:max(.9rem, env(safe-area-inset-top));
    right:clamp(.9rem, 3vw, 2rem);
    z-index:10;
    display:grid;
    grid-template-columns:repeat(4, 3rem);
    padding:4px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(14,14,14,.72);
    -webkit-backdrop-filter:blur(10px);
    backdrop-filter:blur(10px);
    isolation:isolate;
  }
  .lang::before{
    content:'';
    position:absolute;
    z-index:-1;
    top:4px;bottom:4px;left:4px;
    width:3rem;
    border-radius:999px;
    background:var(--text);
    transform:translateX(calc(var(--i, 0) * 100%));
    transition:transform .5s var(--ease);
  }
  .lang button{
    height:2.25rem;
    border:0;
    border-radius:999px;
    background:none;
    color:var(--mute);
    font:500 .82rem/1 var(--ui);
    letter-spacing:.06em;
    cursor:pointer;
    transition:color .3s;
  }
  .lang button:hover{color:var(--text)}
  .lang button[aria-pressed="true"]{color:#0e0e0e}

  /* ---------- Hero: the name ---------- */
  .hero{
    --p:0;
    position:relative;
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:6rem var(--pad) 5rem;
    overflow-x:clip;
  }
  .name{
    margin:0;
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(1.5rem, 8.4vw, 8rem);
    letter-spacing:-.02em;
    opacity:calc(1 - var(--p) * .9);
  }
  .line{
    display:block;
    overflow:hidden;
    line-height:1.05;
    padding-block:.04em .16em;
    will-change:transform;
  }
  .l1{transform:translateX(calc(var(--p) * -10vw))}
  .l2{transform:translateX(calc(var(--p) * 8vw))}
  .l3{transform:translateX(calc(var(--p) * -14vw));color:var(--mute)}
  .word{
    display:inline-block;
    transform:translateY(-115%);
    animation:fall 1.2s var(--settle) forwards;
    animation-delay:calc(.25s + var(--n) * .16s);
  }
  @keyframes fall{to{transform:translateY(0)}}

  .cue{
    position:absolute;
    left:var(--pad);
    bottom:2rem;
    width:1px;
    height:4.5rem;
    background:var(--line);
    overflow:hidden;
    opacity:calc(1 - var(--p) * 4);
  }
  .cue::after{
    content:'';
    position:absolute;
    left:0;top:-40%;
    width:100%;height:40%;
    background:var(--text);
    animation:drip 2.2s var(--ease) 1.8s infinite;
  }
  @keyframes drip{to{top:100%}}

  /* ---------- Falling text (shared by About and the closing word) ---------- */
  .mask{
    display:block;
    overflow:hidden;
    padding-block:.06em .2em;
  }
  .drop{display:block}
  .js .drop{
    transform:translateY(-125%);
    transition:transform 1s var(--settle);
    transition-delay:calc(var(--n, 0) * .14s);
  }
  .js .reveal.seen .drop{transform:none}

  /* ---------- About ---------- */
  .about{
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    padding:5rem var(--pad);
  }
  .about-body{width:min(100%, 64rem)}
  .about-intro{
    --n:0;
    margin:0 0 clamp(1.5rem, 4vw, 3rem);
    font:500 clamp(1.05rem, 2.6vw, 1.5rem)/1.3 var(--ui);
    color:var(--mute);
  }
  .roles{list-style:none;margin:0;padding:0}
  .role{
    position:relative;
    padding-block:clamp(.9rem, 2.4vw, 1.5rem);
    font:300 clamp(1.4rem, 5vw, 3.8rem)/1.12 var(--display);
    letter-spacing:-.02em;
  }
  .role:last-child{color:var(--mute)}
  .role::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:1px;
    background:var(--line);
    transform-origin:left;
  }
  .js .role::before{
    transform:scaleX(0);
    transition:transform 1.2s var(--ease);
    transition-delay:calc(var(--n, 0) * .14s);
  }
  .js .reveal.seen .role::before{transform:none}

  /* ---------- Phone ---------- */
  .phone-section{
    min-height:90vh;
    min-height:90svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4rem var(--pad);
  }
  .phone{width:min(100%, 30rem)}
  .js .phone{
    opacity:0;
    transform:translateY(-32px);
    transition:opacity .8s var(--settle), transform 1s var(--settle);
  }
  .js .phone.seen{opacity:1;transform:none}

  .phone-card{
    --x:50%;
    --y:50%;
    position:relative;
    isolation:isolate;
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2.125rem;
    transition:border-radius .6s var(--ease), border-color .6s, transform .18s;
  }
  .phone-card:has(.phone-toggle:active){transform:scale(.98)}
  .phone-card.open{border-radius:1.75rem;border-color:var(--text)}

  .fill{
    position:absolute;
    inset:0;
    z-index:-1;
    background:var(--text);
    clip-path:circle(0px at var(--x) var(--y));
    transition:clip-path .85s var(--ease);
  }
  .phone-card.open .fill{clip-path:circle(900px at var(--x) var(--y))}

  /* white text + difference blend = light on dark, black on the white fill */
  .phone-toggle,
  .panel{
    color:#fff;
    mix-blend-mode:difference;
  }
  .phone-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    height:4.25rem;
    padding:0 1.75rem;
    border:0;
    background:none;
    font:500 1.05rem/1 var(--ui);
    text-align:left;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .label.swap{animation:fall-in .6s var(--settle)}
  @keyframes fall-in{from{transform:translateY(-60%);opacity:0}to{transform:none;opacity:1}}

  .icon{
    position:relative;
    width:14px;height:14px;
    flex:none;
    transition:transform .6s var(--ease);
  }
  .icon::before,.icon::after{
    content:'';
    position:absolute;
    left:0;top:50%;
    width:100%;height:1.5px;
    margin-top:-.75px;
    background:currentColor;
  }
  .icon::after{transform:rotate(90deg)}
  .phone-card.open .icon{transform:rotate(135deg)}

  .panel{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .65s var(--ease);
  }
  .phone-card.open .panel{grid-template-rows:1fr}
  .panel-inner{min-height:0;overflow:hidden}
  .num{
    display:block;
    padding:1.25rem 1.75rem;
    border-top:1px solid rgba(255,255,255,.2);
    color:inherit;
    text-decoration:none;
    font:500 clamp(1.15rem, 4.6vw, 1.45rem)/1.2 var(--ui);
    font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
    opacity:0;
    transform:translateY(-14px);
    transition:opacity .35s, transform .35s;
  }
  @media (hover:hover){.num:hover{opacity:.65 !important}}
  .phone-card.open .num{
    opacity:1;
    transform:none;
    transition:opacity .55s var(--settle), transform .7s var(--settle);
  }
  .phone-card.open .num:nth-child(1){transition-delay:.3s}
  .phone-card.open .num:nth-child(2){transition-delay:.42s}

  /* ---------- Social links ---------- */
  .social-section{
    min-height:70vh;
    min-height:70svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4rem var(--pad);
  }
  .social{
    width:min(100%, 30rem);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.75rem;
  }
  .social a{
    position:relative;
    isolation:isolate;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.7rem;
    height:4.25rem;
    padding:0 1rem;
    border:1px solid var(--line);
    border-radius:2.125rem;
    background:var(--surface);
    color:#fff;
    text-decoration:none;
    font:500 1rem/1 var(--ui);
    -webkit-tap-highlight-color:transparent;
    transition:transform .25s var(--settle), border-color .4s;
  }
  .social a::before{
    content:'';
    position:absolute;
    inset:0;
    z-index:-1;
    background:var(--text);
    transform:translateY(101%);
    transition:transform .55s var(--ease);
  }
  .social a:focus-visible{border-color:var(--text)}
  .social a:focus-visible::before{transform:none}
  @media (hover:hover){
    .social a:hover{border-color:var(--text)}
    .social a:hover::before{transform:none}
    .social a:hover .ico{transform:translateY(-3px) rotate(-10deg) scale(1.1)}
  }
  .social a:active{transform:scale(.96)}
  .social .txt{mix-blend-mode:difference}
  .ico{
    width:1.75rem;height:1.75rem;
    flex:none;
    transition:transform .5s var(--settle);
  }
  .social a:focus-visible .ico{transform:translateY(-3px) rotate(-10deg) scale(1.1)}

  .js .social a{opacity:0}
  .js .social.seen a{
    opacity:1;
    animation:land 1.1s cubic-bezier(.3,1.35,.5,1) backwards;
    animation-delay:calc(var(--n) * .16s);
  }
  @keyframes land{
    from{opacity:0;transform:translateY(-64px)}
    to{opacity:1;transform:none}
  }

  /* ---------- Closing word ---------- */
  .outro{
    min-height:100vh;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding:4rem var(--pad);
  }
  .outro-word{
    margin:0;
    overflow:hidden;
    padding-block:.1em .22em;
    font-family:var(--display);
    font-weight:300;
    font-size:clamp(1.6rem, 7.4vw, 7rem);
    line-height:1.1;
    letter-spacing:-.02em;
    white-space:nowrap;
    text-align:right;
    max-width:100%;
  }
  .ch{
    display:inline-block;
    transform:translateY(-125%);
    transition:transform 1s var(--settle);
    transition-delay:calc(var(--i) * 50ms);
  }
  .outro-word.seen .ch{transform:none}

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      animation-delay:0s !important;
      transition-duration:.001ms !important;
      transition-delay:0s !important;
    }
    .line{transform:none !important}
  }
</style>
</head>
<body>

<nav class="lang" aria-label="Til / Language">
  <button type="button" data-lang="uz" lang="uz" aria-label="O‘zbekcha" aria-pressed="true">UZ</button>
  <button type="button" data-lang="en" lang="en" aria-label="English" aria-pressed="false">EN</button>
  <button type="button" data-lang="ru" lang="ru" aria-label="Русский" aria-pressed="false">RU</button>
  <button type="button" data-lang="de" lang="de" aria-label="Deutsch" aria-pressed="false">DE</button>
</nav>

<header class="hero" id="top">
  <h1 class="name">
    <span class="line l1"><span class="word" style="--n:0">Abdulaziz</span></span>

    <span class="line l3"><span class="word" style="--n:2">Nosirovich</span></span>
  </h1>
  <span class="cue" aria-hidden="true"></span>
</header>

<main>
  <section class="about">
    <div class="about-body reveal">
      <p class="about-intro"><span class="mask"><span class="drop" data-i18n="intro">Men Abdulaziz Sayitmurodov</span></span></p>
      <ul class="roles">
        <li class="role" style="--n:1"><span class="mask"><span class="drop" data-i18n="role1">Content creator</span></span></li>

  <section class="phone-section">

        <div class="panel" id="phone-panel">

            <a class="num" href="tel:+998909476979">+998 (90) 947 69 79</a>
            <a class="num" href="tel:+998903890429">+998 (90) 389 04 29</a>
          </div>
        </div>
      </div>

  </section>

  <section class="social-section">
    <div class="social reveal">
      <a href="https://t.me/Sayitmurodov" data-social style="--n:0" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#fff"/>
          <path fill="#2AABEE" d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
        </svg>
        <span class="txt">Telegram</span>
      </a>
      <a href="https://www.instagram.com/abdulaziz.nosirovicc/" data-social style="--n:1" target="_blank" rel="noopener noreferrer" aria-label="Instagram">

          <defs>

  <section class="outro">

</main>

<script>
(function () {
  var dict = {
    uz: { phone: 'Telefon raqami', intro: 'Men Abdulaziz Sayitmurodov',   role1: 'Content creator', role2: 'AI editor',      role3: 'Maktab o‘quvchisiman', outro: 'Ko‘rishguncha' },
    en: { phone: 'Phone number',   intro: 'I’m Abdulaziz Sayitmurodov',    role1: 'Content creator', role2: 'AI editor',      role3: 'I’m a school student', outro: 'See you soon' },
    ru: { phone: 'Номер телефона', intro: 'Я Абдулазиз Сайитмуродов',      role1: 'Контент-мейкер',  role2: 'AI-редактор',    role3: 'Я школьник',           outro: 'До встречи' },
    de: { phone: 'Telefonnummer',  intro: 'Ich bin Abdulaziz Sayitmurodov', role1: 'Content Creator', role2: 'KI-Editor',      role3: 'Ich bin Schüler',      outro: 'Bis bald' }
  };
  var order = ['uz', 'en', 'ru', 'de'];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var root = document.documentElement;
  var langBar = document.querySelector('.lang');
  var buttons = Array.prototype.slice.call(langBar.querySelectorAll('button'));
  var phoneLabel = document.querySelector('.label[data-i18n="phone"]');
  var outroWord = document.querySelector('.outro-word');
  var reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));

  function buildOutro(text) {
    outroWord.setAttribute('aria-label', text);
    outroWord.textContent = '';
    Array.from(text).forEach(function (c, i) {
      var s = document.createElement('span');
      s.className = 'ch';
      s.setAttribute('aria-hidden', 'true');
      s.style.setProperty('--i', i);
      s.textContent = c === ' ' ? '\u00A0' : c;
      outroWord.appendChild(s);
    });
  }

  /* jump back to the start and let it fall again */
  function replay(el) {
    var wasSeen = el.classList.contains('seen');
    el.classList.add('reset');
    el.classList.remove('seen');
    void el.offsetWidth;
    el.classList.remove('reset');
    if (wasSeen) {
      requestAnimationFrame(function () { el.classList.add('seen'); });
    }
  }

  function setLang(lang, initial) {
    if (!dict[lang]) lang = 'uz';
    root.lang = lang;
    langBar.style.setProperty('--i', order.indexOf(lang));
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
      el.textContent = dict[lang][el.dataset.i18n];
    });
    buildOutro(dict[lang].outro);

    if (!initial) {
      reveals.forEach(function (el) {
        if (el.querySelector('.drop, .ch') || el.classList.contains('outro-word')) replay(el);
      });
      phoneLabel.classList.remove('swap');
      void phoneLabel.offsetWidth;
      phoneLabel.classList.add('swap');
    }
    try { localStorage.setItem('lang', lang); } catch (e) {}
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { setLang(b.dataset.lang, false); });
  });

  var saved = 'uz';
  try { saved = localStorage.getItem('lang') || 'uz'; } catch (e) {}
  setLang(saved, true);

  /* Everything falls into place when it scrolls into view */
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var el = e.target;
        if (e.isIntersecting) {
          el.classList.add('seen');
          if (el.hasAttribute('data-once')) io.unobserve(el);
        } else if (!el.hasAttribute('data-once')) {
          el.classList.remove('seen');
        }
      });
    }, { threshold: 0.4 });
    reveals.forEach(function (el) { io.observe(el); });
  } else {
    reveals.forEach(function (el) { el.classList.add('seen'); });
  }

  /* Phone button: the fill spreads from the exact point you tap */
  var card = document.querySelector('.phone-card');
  var toggle = card.querySelector('.phone-toggle');
  toggle.addEventListener('click', function (e) {
    var open = toggle.getAttribute('aria-expanded') !== 'true';
    var r = card.getBoundingClientRect();
    var fromKeyboard = e.detail === 0;
    var x = fromKeyboard ? r.width / 2 : e.clientX - r.left;
    var y = fromKeyboard ? toggle.offsetHeight / 2 : e.clientY - r.top;
    card.style.setProperty('--x', x + 'px');
    card.style.setProperty('--y', y + 'px');
    toggle.setAttribute('aria-expanded', String(open));
    card.classList.toggle('open', open);
  });

  /* Social links: until a real link is added, tapping does nothing */
  Array.prototype.forEach.call(document.querySelectorAll('a[data-social]'), function (a) {
    a.addEventListener('click', function (e) {
      if (a.getAttribute('href') === '#') e.preventDefault();
    });
  });

  /* Name drifts sideways and fades as you scroll away from it */
  if (!reduce) {
    var hero = document.querySelector('.hero');
    var ticking = false;
    var update = function () {
      var p = Math.min(Math.max(window.scrollY / hero.offsetHeight, 0), 1);
      hero.style.setProperty('--p', p.toFixed(4));
      ticking = false;
    };
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(update); }
    }, { passive: true });
    update();
  }
})();
</script>
</body>
</html>
